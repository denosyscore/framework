name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', dependencies: 'highest' }
          - { php: '8.2', dependencies: 'lowest' }
          - { php: '8.5', dependencies: 'highest' }
          - { php: '8.5', dependencies: 'no-dev' }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install declared dependencies
        if: matrix.dependencies == 'highest'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install lowest supported dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --no-interaction --prefer-dist --no-progress

      - name: Install without optional adapters
        if: matrix.dependencies == 'no-dev'
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        run: |
          if [ -d src ]; then
            find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          else
            echo "No src/ directory to lint."
          fi

      - name: Standalone integration
        run: composer test

      - name: Audit locked dependency set
        run: composer audit --locked

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      # Level max with a frozen baseline: new errors fail, and fixed errors
      # must be removed from phpstan-baseline.neon.
      - name: PHPStan
        run: composer analyse
