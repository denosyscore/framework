name: Split packages

# Publishes each packages/<name> directory to its read-only repository,
# denosyscore/<name>, which Packagist reads. Splits are deterministic, so
# every push fast-forwards the package repository.
#
# Tags: a minor release (vX.Y.0, and pre-releases) tags every package; a patch
# release tags only the packages that changed since the previous tag, so an
# unchanged package never gets an empty release.
#
# Requires the SPLIT_TOKEN secret: a fine-grained token with Contents
# read/write on the package repositories.
#
# A package whose push fails does not stop the others: every package is
# pushed, then the job fails and lists the ones that were not. To publish a
# tag again after fixing the cause, run this workflow by hand with the tag.

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish again, for example v0.17.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: split
  cancel-in-progress: false

jobs:
  # Runs without access to SPLIT_TOKEN, so the third-party PHP setup action
  # never shares a job with the token.
  version-line:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      # A tag must belong to the declared version line, so a release can never
      # ship sibling requirements on the previous line.
      - name: Check the version line
        env:
          REF_TYPE: ${{ inputs.tag && 'tag' || github.ref_type }}
          REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            bin/package-ci versions --tag "$REF_NAME"
          else
            bin/package-ci versions
          fi

  split:
    needs: version-line
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          # Otherwise checkout's URL-specific GITHUB_TOKEN header takes
          # precedence over SPLIT_TOKEN, and pushes are refused.
          persist-credentials: false

      - name: Split and push
        env:
          SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
          REF_TYPE: ${{ inputs.tag && 'tag' || github.ref_type }}
          REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$SPLIT_TOKEN" ]; then
            echo "::error::The SPLIT_TOKEN secret is not set, so packages cannot be published."
            exit 1
          fi
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SPLIT_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          if [ "$REF_TYPE" = tag ] && ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::[$REF_NAME] is not a vX.Y.Z tag."
            exit 1
          fi
          failed=()

          previous=""
          if [ "$REF_TYPE" = tag ]; then
            previous=$(git describe --tags --abbrev=0 --match 'v*.*.*' "refs/tags/$REF_NAME^" 2>/dev/null || true)
          fi

          for dir in packages/*/; do
            package=$(basename "$dir")
            sha=$(git subtree split -q --prefix="packages/$package" HEAD)
            remote="https://github.com/denosyscore/$package.git"

            # A new package publishes once its repository exists and the token
            # can reach it; until then skip it instead of failing every package.
            if ! git -c http.extraheader="$auth" ls-remote "$remote" >/dev/null 2>&1; then
              echo "::warning::denosyscore/$package is not reachable; create it and grant SPLIT_TOKEN access to publish packages/$package."
              continue
            fi

            if [ "$REF_TYPE" = branch ]; then
              git -c http.extraheader="$auth" push "$remote" "$sha:refs/heads/main" || failed+=("$package")
              continue
            fi

            # Patch releases skip packages with no changes since the previous tag.
            if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[1-9][0-9]*$ ]] && [ -n "$previous" ] \
              && git diff --quiet "refs/tags/$previous" "refs/tags/$REF_NAME" -- "packages/$package"; then
              echo "$package: unchanged since $previous, not tagged"
              continue
            fi
            if git -c http.extraheader="$auth" push "$remote" "$sha:refs/tags/$REF_NAME"; then
              echo "$package: tagged $REF_NAME"
            else
              failed+=("$package")
            fi
          done

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Not published: ${failed[*]}. Check that SPLIT_TOKEN has Contents read/write on each of these repositories, then run this workflow by hand with the tag."
            exit 1
          fi
