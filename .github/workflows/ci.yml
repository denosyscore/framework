name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
        database: ['0.2.3', '0.3.0', '0.4.0', '0.5.0']
        carbon: ['2.73.0', '^3.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: |
          composer require --no-update --no-interaction 'denosyscore/database:${{ matrix.database }}' 'nesbot/carbon:${{ matrix.carbon }}'
          composer install --no-interaction --prefer-dist

      - name: PHP syntax check
        run: |
          if [ -d src ]; then
            find src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          else
            echo "No src/ directory to lint."
          fi

      - name: Validation regression tests
        run: composer test

      - name: Rule parameter static analysis
        run: composer analyse
