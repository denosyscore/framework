name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        profile: ['minimum-components', 'current-components']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Select minimum published component versions
        if: matrix.profile == 'minimum-components'
        run: |
          composer require --no-update --no-interaction 'denosyscore/auth:0.3.3' 'denosyscore/cache:0.2.3' 'denosyscore/console:0.4.2' 'denosyscore/database:0.5.0' 'denosyscore/filesystem:0.4.0' 'denosyscore/http:0.4.0' 'denosyscore/queue:0.3.3' 'denosyscore/session:0.2.6' 'denosyscore/validation:0.3.4' 'denosyscore/view:0.3.0'

      - name: Install published dependency combination
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        run: |
          for dir in src support; do
            if [ -d "$dir" ]; then
              find "$dir" -type f -name '*.php' -print0 | xargs -0 -n1 php -l
            fi
          done

      - name: Framework tests
        run: composer test

      - name: Audit resolved dependencies
        run: composer audit --locked
