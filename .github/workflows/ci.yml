name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.4', database: '0.2.3', validation: '0.2.2', http: '0.2.2', auth: '0.2.2', console: '0.3.0', queue: '0.3.0', session: '0.2.2' }
          - { php: '8.5', database: '0.2.3', validation: '0.2.2', http: '0.2.2', auth: '0.2.2', console: '0.3.0', queue: '0.3.0', session: '0.2.2' }
          - { php: '8.4', database: '0.3.0', validation: '0.3.0', http: '0.3.0', auth: '0.3.0', console: '0.3.1', queue: '0.3.1', session: '0.2.3' }
          - { php: '8.5', database: '0.3.0', validation: '0.3.0', http: '0.3.0', auth: '0.3.0', console: '0.3.1', queue: '0.3.1', session: '0.2.3' }
          - { php: '8.4', database: '0.4.0', validation: '0.3.2', http: '0.3.1', auth: '0.3.1', console: '0.3.2', queue: '0.3.2', session: '0.2.4' }
          - { php: '8.5', database: '0.4.0', validation: '0.3.2', http: '0.3.1', auth: '0.3.1', console: '0.3.2', queue: '0.3.2', session: '0.2.4' }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install published dependency combination
        run: |
          composer require --no-update --no-interaction 'denosyscore/database:${{ matrix.database }}' 'denosyscore/validation:${{ matrix.validation }}' 'denosyscore/http:${{ matrix.http }}' 'denosyscore/auth:${{ matrix.auth }}' 'denosyscore/console:${{ matrix.console }}' 'denosyscore/queue:${{ matrix.queue }}' 'denosyscore/session:${{ matrix.session }}' 'denosyscore/filesystem:0.3.3'
          composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        run: |
          for dir in src support; do
            if [ -d "$dir" ]; then
              find "$dir" -type f -name '*.php' -print0 | xargs -0 -n1 php -l
            fi
          done

      - name: Framework tests
        run: composer test

      - name: Audit resolved dependencies
        run: composer audit --locked
